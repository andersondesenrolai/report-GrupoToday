<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b12">
  <title>CRM · Fechamento Agosto 2026</title>
  <style>
    @font-face{font-family:Norte;src:url('assets/norte.woff2') format('woff2');font-weight:400 800;font-display:swap}
    @font-face{font-family:Epilogue;src:url('assets/epilogue-400.woff2') format('woff2');font-weight:400 700;font-display:swap}
    @font-face{font-family:"DM Sans";src:url('assets/epilogue-400.woff2') format('woff2');font-weight:400 700;font-display:swap}
    @font-face{font-family:Syne;src:url('assets/norte.woff2') format('woff2');font-weight:400 800;font-display:swap}
    @font-face{font-family:"DM Mono";src:url('assets/epilogue-400.woff2') format('woff2');font-weight:400 700;font-display:swap}
    @font-face{font-family:"IBM Plex Mono";src:url('assets/ibm-plex-mono-500.woff2') format('woff2');font-weight:500;font-display:swap}
    :root{--bg:#0b0b12;--surface:#12131d;--surface-2:#181a26;--line:rgba(255,255,255,.1);--text:#f6f5fa;--muted:#a8a8b7;--accent:#9f7aea;--accent-rgb:159,122,234;--good:#79d7af;--warm:#ffb778;--danger:#fc868d}
    *{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 620px at 82% -8%,rgba(var(--accent-rgb),.18),transparent 62%),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-width:320px}.shell{max-width:1480px;margin:0 auto;padding:22px 24px 56px}.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 18px;gap:18px}.brand{display:flex;align-items:center;gap:11px;font-family:Syne,sans-serif;font-size:14px;letter-spacing:-.03em}.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:var(--accent);color:#181126;font-weight:800}.period{font:500 11px "DM Mono",monospace;color:var(--muted);letter-spacing:.04em}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:34px;margin-top:28px}.rail{position:sticky;top:20px;align-self:start}.rail h1{font:700 28px/1 Syne,sans-serif;letter-spacing:-.07em;margin:12px 0 28px}.rail h1 span{display:block;color:var(--muted);font:500 13px/1.3 "DM Mono",monospace;letter-spacing:0;margin-top:12px}.event-tabs{display:grid;gap:5px}.event-tab{appearance:none;text-align:left;border:0;border-radius:11px;color:var(--muted);background:transparent;padding:12px 12px;font:600 13px "DM Sans",sans-serif;cursor:pointer;transition:.2s}.event-tab:hover{background:rgba(255,255,255,.05);color:var(--text)}.event-tab[aria-selected="true"]{color:var(--text);background:rgba(var(--accent-rgb),.14);box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.25)}.rail-note{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;font-size:12px;line-height:1.5;color:var(--muted)}main{min-width:0}.hero{min-height:270px;display:flex;align-items:flex-end;padding:26px 28px 30px;position:relative;overflow:hidden;background:linear-gradient(125deg,rgba(var(--accent-rgb),.21),rgba(255,255,255,.025) 55%,rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.12);border-radius:20px}.hero:after{content:"";position:absolute;width:500px;height:500px;right:-220px;top:-260px;border-radius:50%;background:radial-gradient(circle,rgba(var(--accent-rgb),.65) 0 2%,transparent 2.5% 5%,rgba(var(--accent-rgb),.23) 5.5% 6%,transparent 6.5% 11%,rgba(var(--accent-rgb),.16) 11.5% 12%,transparent 12.5%);opacity:.75;transform:rotate(20deg)}.hero-copy{max-width:720px;position:relative;z-index:1}.hero .eyeline{font:500 11px "DM Mono",monospace;color:var(--accent);letter-spacing:.08em;margin-bottom:18px}.hero h2{font:700 clamp(34px,4.8vw,68px)/.98 Syne,sans-serif;letter-spacing:-.075em;margin:0;text-wrap:balance}.hero p{margin:18px 0 0;max-width:620px;color:#d1cfda;font-size:16px;line-height:1.5}.section{margin-top:34px}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:0 0 15px}.section-heading h3{font:700 23px/1 Syne,sans-serif;letter-spacing:-.055em;margin:0}.section-heading p{font-size:12px;color:var(--muted);margin:0;text-align:right;max-width:370px;line-height:1.45}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{min-height:146px;padding:17px;border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}.metric .label{font:500 11px "DM Mono",monospace;color:var(--muted);line-height:1.35}.metric strong{font:700 clamp(27px,3vw,42px)/1 Syne,sans-serif;letter-spacing:-.075em}.metric small{font-size:11px;color:var(--good)}.grid{display:grid;grid-template-columns:1.17fr .83fr;gap:14px}.panel{background:rgba(255,255,255,.032);border:1px solid var(--line);border-radius:16px;padding:21px}.panel h4{font:700 17px/1.1 Syne,sans-serif;letter-spacing:-.045em;margin:0 0 20px}.split-list{display:grid;gap:14px}.split-row{display:grid;grid-template-columns:112px 1fr auto;align-items:center;gap:12px;font-size:12px}.split-row span:first-child{color:#dddbe6}.track{height:7px;border-radius:100px;background:rgba(255,255,255,.08);overflow:hidden}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#e0ceff)}.split-row b{font:500 11px "DM Mono",monospace;color:var(--muted)}.insight{display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,rgba(var(--accent-rgb),.2),rgba(255,255,255,.03));min-height:238px}.quote{font:700 30px/1.08 Syne,sans-serif;letter-spacing:-.065em;max-width:390px}.insight footer{font:500 11px "DM Mono",monospace;color:var(--accent);line-height:1.4}.campaign-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.campaign-list{display:grid;gap:0}.campaign{display:grid;grid-template-columns:minmax(145px,1.2fr) repeat(3,80px);gap:15px;padding:14px 0;border-top:1px solid var(--line);align-items:center}.campaign:first-child{border-top:0;padding-top:0}.campaign-name{font-size:13px;font-weight:600}.campaign-name small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:3px}.campaign-value{font:500 12px "DM Mono",monospace;text-align:right}.campaign-value small{display:block;color:var(--muted);font:400 10px "DM Sans",sans-serif;margin-bottom:2px}.needle-wrap{display:grid;grid-template-columns:repeat(4,1fr);height:138px;align-items:end;gap:12px;padding:0 6px 6px;border-bottom:1px solid var(--line)}.needle{min-height:14px;border-radius:7px 7px 1px 1px;background:linear-gradient(180deg,#ebdcff,var(--accent));position:relative}.needle b{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);font:500 10px "DM Mono",monospace;white-space:nowrap}.needle-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:9px;text-align:center;font-size:10px;color:var(--muted)}.finance{overflow:auto;padding:0}.finance table{width:100%;border-collapse:collapse;min-width:600px}.finance th,.finance td{padding:15px 18px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}.finance th{font:500 10px "DM Mono",monospace;color:var(--muted);letter-spacing:.04em}.finance td:last-child,.finance th:last-child{text-align:right;font-family:"DM Mono",monospace}.finance tr:last-child td{border-bottom:0}.finance .total td{font-weight:700;color:var(--text);background:rgba(var(--accent-rgb),.08)}.exceptions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.exception{padding:17px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.exception b{font:700 13px Syne,sans-serif;letter-spacing:-.03em}.exception p{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 0 0}.source{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font:400 10px/1.55 "DM Mono",monospace;color:#777685}.source b{color:#b8b5c4;font-weight:500}@media(max-width:980px){.layout{grid-template-columns:1fr}.rail{position:static}.rail h1{margin-bottom:16px}.event-tabs{grid-template-columns:repeat(3,1fr)}.rail-note{display:none}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.shell{padding:16px 14px 36px}.topbar{align-items:flex-start;flex-direction:column;gap:8px}.event-tabs{grid-template-columns:1fr}.hero{min-height:305px;padding:23px 20px}.hero h2{font-size:39px}.grid,.campaign-grid{grid-template-columns:1fr}.metrics,.exceptions{grid-template-columns:1fr}.section-heading{align-items:flex-start;flex-direction:column}.section-heading p{text-align:left}.campaign{grid-template-columns:1fr repeat(3,1fr);gap:8px}.campaign-name{grid-column:1/-1}.campaign-value{text-align:left}.quote{font-size:28px}}
  .hero{background:linear-gradient(90deg,rgba(6,10,18,.96) 0%,rgba(6,10,18,.88) 43%,rgba(6,10,18,.34) 100%),var(--hero-image) center/cover no-repeat}.hero-copy{position:relative;z-index:1}.brand img{display:block;width:132px;height:auto;max-height:25px}.brand .mark{display:none}.brand span{padding-left:11px;border-left:1px solid var(--line);font:500 11px "DM Mono",monospace;letter-spacing:.08em;color:var(--muted)}.hero h2{letter-spacing:-.048em}.metric strong{letter-spacing:-.055em}.section-heading h3,.panel h4{letter-spacing:-.038em}.quote{letter-spacing:-.05em}.metric .label{font-size:12px}.metric small{font-size:12px}.panel h4{font-size:19px}.split-row{font-size:14px;grid-template-columns:150px 1fr auto}.split-row b{font:500 12px "IBM Plex Mono",monospace}.campaign-name{font-size:15px}.campaign-name small{font-size:12px}.campaign-value,.finance td:last-child,.finance th:last-child,.needle b{font-family:"IBM Plex Mono",monospace;font-size:13px}.campaign-value small{font-size:11px}.needle b{font-size:11px}.finance th{font-size:11px}.finance td{font-size:14px}.exception b{font-size:14px}.exception p{font-size:13px}.section-heading p{font-size:13px}@media(max-width:760px){.hero{background:linear-gradient(180deg,rgba(6,10,18,.94),rgba(6,10,18,.78)),var(--hero-image) center/cover no-repeat}.brand img{width:118px}.split-row{grid-template-columns:110px 1fr auto;font-size:12px}}
</style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><img src="assets/logo-desenrolai-branco.svg" alt="Desenrolaí"> <span>CRM PERFORMANCE</span></div><div class="period">FECHAMENTO · AGOSTO 2026</div></header>
    <div class="layout">
      <aside class="rail"><h1>O mês<br>em sinal.<span>Três CRMs · uma leitura executiva</span></h1><nav class="event-tabs" aria-label="Selecionar CRM" id="eventTabs"></nav><p class="rail-note">Resultados de negócio, comunicação e investimento na mesma leitura. Exceções são preservadas em vez de mascaradas.</p></aside>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <script>
    const reports={
      saudade:{name:'Réveillon Saudade',accent:'#b197fc',rgb:'177,151,252',thesis:'A régua de carrinho indicou recuperação pós-disparo; o cupom foi sinal de atribuição, não o motor da conversão.',metrics:[['Base CRM','14.935','snapshot 31/08'],['Compradores','893','tag comprador'],['Receita rastreada','R$ 109,7 mil','cupons CRM01–03'],['Investimento CRM','R$ 2.285,39','US$ 443,67 · PTAX média']],splitTitle:'Eficiência rastreável · agosto',split:[['Faturamento rastreado','R$ 109.687,00',100],['Investimento CRM','R$ 2.285,39',2],['ROAS rastreado','47,99×',48]],insight:'Cada R$ 1 investido no CRM gerou R$ 47,99 de faturamento identificado por cupom.',insightFoot:'PTAX média de agosto: R$ 5,1511 / US$ · 30 ingressos por cupom',campaigns:[['Virada · uma semana antes','E-mail · 10.887 envios','98,39%','26,82%','1,06%'],['Virada · amanhã','E-mail · 10.865 envios','97,75%','24,66%','0,53%'],['Virada · hoje','E-mail · 10.848 envios','98,48%','23,26%','0,51%'],['Beach Club','E-mail · 13.589 envios','98,49%','23,33%','0,54%']],bars:[['E-mail · entrega',98],['E-mail · abertura',25],['E-mail · clique',1],['WA · corte pendente',0]],finance:[['WhatsApp Marketing','R$ 1.799,07'],['WhatsApp Utility','R$ 97,87'],['E-mails','R$ 220,26'],['Verificação de e-mail','R$ 63,00'],['Telefonia / outros','R$ 105,19']],exceptions:[['Injoy · receita','123 compradores de pacotes entram no volume de compradores. A composição financeira permanece pendência de exceção.'],['Funil · origem','Tags são a fonte de compradores e carrinhos enquanto opportunities importadas anteriores seguem subcontadas.'],['Identidade · Injoy','Duas pessoas compartilham e-mail e telefone em uma mesma identidade CRM; dado preservado sem dedução.']]},
      mpf:{name:'Mundo Psicodélico',accent:'#75e1ae',rgb:'117,225,174',thesis:'Base corrigida, entrega estabilizada e medição por cupom preparada para setembro.',metrics:[['Compradores','672','Ingresse · 31/08'],['Carrinhos elegíveis','387','sem compra confirmada'],['Processados','1.059','0 erros de API'],['Investimento','R$ 1.410,53','US$ 273,83 · PTAX média']],split:[['WhatsApp','R$ 1.016,16',100],['E-mails','R$ 333,79',33],['Verificação','R$ 27,35',3]],insight:'A campanha de line-up expôs a ruptura de entregabilidade. A onda posterior voltou a 98,55% de entrega.',insightFoot:'Diagnóstico convertido em correção de base · PTAX média R$ 5,1511 / US$',campaigns:[['Fim de Semana sem Taxa','E-mail · workflow consolidado','98,55%','31,39%','0,95%'],['Interessados','WhatsApp · 253 contatos','75,0%','39,9%','—'],['Carrinho abandonado','WhatsApp · 179 contatos','76,5%','31,8%','—'],['Engajados HOT','WhatsApp · 375 contatos','85,3%','28,2%','—']],bars:[['E-mail · entrega',99],['WA · entrega',80],['WA · leitura',33],['E-mail · clique',1]],finance:[['WhatsApp','R$ 1.016,16'],['E-mails','R$ 333,79'],['Verificação de e-mail','R$ 27,35'],['Outros custos','R$ 33,22']],exceptions:[['Receita por cupom','Códigos CRM passam a valer a partir da próxima operação; agosto não será forçado a uma atribuição inexistente.'],['Carrinho · automação','A nova carga de carrinhos pode ter acionado a régua; medir a conversão no próximo corte.'],['Vendas · fonte','Ingresse é a fonte de venda; a ROI Scale recebe a marcação de comprador depois da conciliação.']]},
      todayland:{name:'TodayLand',accent:'#ffba75',rgb:'255,186,117',thesis:'Base e interesse validados antes da abertura de vendas.',metrics:[['Audiência Wade','1.566','duas campanhas'],['Entrega Wade','97,1%','consolidado'],['Abertura Wade','26,4%','consolidado'],['Investimento','R$ 598,97','US$ 116,28 · PTAX média']],split:[['WhatsApp Marketing','R$ 507,74',100],['E-mail e verificação','R$ 67,22',13],['Telefonia','R$ 22,30',4]],insight:'A abertura de 26,4% valida atenção antes da abertura. O próximo corte mede conversão — não receita retroativa.',insightFoot:'Vendas abrem em 01/09 · resultado de agosto = demanda · PTAX média R$ 5,1511 / US$',campaigns:[['Wade · Veterano','E-mail · 644 de audiência','98,12%','27,11%','0,00%'],['Wade · Premium','E-mail · 922 de audiência','98,68%','27,29%','0,00%'],['Boas-vindas','Workflow · 2.113 entradas','98,34%','45,96%','0,00%']],bars:[['E-mail · entrega',98],['Workflow · abertura',46],['WhatsApp · não enviado',0],['CTA · não aplicável',0]],finance:[['WhatsApp Marketing','R$ 507,74'],['E-mail e verificação','R$ 67,22'],['Telefonia','R$ 22,30'],['Outros / diferença Billing','R$ 1,70']],exceptions:[['Receita','Não aplicável em agosto: vendas abrem em 01/09. Não exibir “zero” como se fosse falha.'],['Clique','As peças Wade não tinham CTA rastreável; ausência de clique não mede ausência de interesse.'],['Próximo corte','Setembro inicia a régua de conversão com baseline de base, abertura e investimento já definido.']]}
    };
    const heroImages={saudade:'assets/saudade-hero.jpg',mpf:'assets/mpf-hero.jpeg',todayland:'assets/todayland-hero.jpeg'};
    const money=v=>v; let selected='saudade';
    const app=document.getElementById('app');
    new MutationObserver(()=>{const hero=app.querySelector('.hero');if(hero)hero.style.setProperty('--hero-image',`url('${heroImages[selected]}')`)}).observe(app,{childList:true});
    const escape=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    function render(){const r=reports[selected];document.documentElement.style.setProperty('--accent',r.accent);document.documentElement.style.setProperty('--accent-rgb',r.rgb);document.getElementById('eventTabs').innerHTML=Object.entries(reports).map(([key,x])=>`<button class="event-tab" aria-selected="${key===selected}" onclick="selectReport('${key}')">${x.name}</button>`).join('');document.getElementById('app').innerHTML=`
      <section class="hero"><div class="hero-copy"><div class="eyeline">RELATÓRIO CRM · ${r.name.toUpperCase()} · AGOSTO 2026</div><h2>${r.thesis}</h2><p>Uma leitura de negócio construída a partir de campanhas, base CRM, fontes oficiais de venda e Billing da ROI Scale.</p></div></section>
      <section class="section"><div class="section-heading"><h3>Resultado executivo</h3><p>O mês em quatro pontos de decisão.</p></div><div class="metrics">${r.metrics.map(m=>`<article class="metric"><span class="label">${m[0]}</span><strong>${m[1]}</strong><small>${m[2]}</small></article>`).join('')}</div></section>
      <section class="section grid"><article class="panel"><h4>${r.splitTitle||'Investimento por frente'}</h4><div class="split-list">${r.split.map(x=>`<div class="split-row"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${x[2]}%"></div></div><b>${x[1]}</b></div>`).join('')}</div></article><article class="panel insight"><div class="quote">“${r.insight}”</div><footer>${r.insightFoot}</footer></article></section>
      <section class="section"><div class="section-heading"><h3>Campanhas e jornadas de agosto</h3><p>Entrega, abertura/leitura e clique. Reenvios e entradas técnicas não são somados como campanhas novas.</p></div><div class="campaign-grid"><article class="panel"><div class="campaign-list">${r.campaigns.map(c=>`<div class="campaign"><div class="campaign-name">${c[0]}<small>${c[1]}</small></div><div class="campaign-value"><small>ENTREGA</small>${c[2]}</div><div class="campaign-value"><small>ABERTURA / LEITURA</small>${c[3]}</div><div class="campaign-value"><small>CLIQUE</small>${c[4]}</div></div>`).join('')}</div></article><article class="panel"><h4>Indicadores de funil</h4><div class="needle-wrap">${r.bars.map(b=>`<div class="needle" style="height:${Math.max(8,b[1])}%"><b>${b[1]}%</b></div>`).join('')}</div><div class="needle-labels">${r.bars.map(b=>`<span>${b[0]}</span>`).join('')}</div></article></div></section>
      <section class="section"><div class="section-heading"><h3>Investimento do período</h3><p>Gasto mensal da subconta. Custo de campanha individual só aparece quando existir vínculo comprovado no Wallet.</p></div><article class="panel finance"><table><thead><tr><th>Categoria</th><th>Tipo de custo</th><th>Agosto 2026</th></tr></thead><tbody>${r.finance.map(f=>`<tr><td>${f[0]}</td><td>Uso da subconta</td><td>${f[1]}</td></tr>`).join('')}<tr class="total"><td>Total</td><td>Billing ROI Scale</td><td>${r.metrics[3][1]}</td></tr></tbody></table></article></section>
      <section class="section"><div class="section-heading"><h3>Exceções que ficam visíveis</h3><p>Tratadas como pendência, sem distorcer o resultado confirmado.</p></div><div class="exceptions">${r.exceptions.map(e=>`<article class="exception"><b>${e[0]}</b><p>${e[1]}</p></article>`).join('')}</div></section>
      <footer class="source"><b>Fontes do corte:</b> ROI Scale (ações, workflows e Billing); MeuBilhete, Ingresse e Injoy conforme o evento. Billing capturado em 30/08 às 23:59 UTC; não houve disparos planejados em 31/08. Conversão de custos: PTAX média de agosto/2026, R$ 5,1511 por US$ 1; valores arredondados por linha. ROAS compara receita rastreada por cupom e custo convertido, sem margem, taxas ou receita Injoy.</footer>`;}
    function selectReport(id){selected=id;render()}render();
  </script>
</body>
</html>
