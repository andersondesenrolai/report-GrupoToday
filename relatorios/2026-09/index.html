    *{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 620px at 82% -8%,rgba(var(--accent-rgb),.18),transparent 62%),var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-width:320px}.shell{max-width:1480px;margin:0 auto;padding:22px 24px 56px}.topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 18px;gap:18px}.brand{display:flex;align-items:center;gap:11px;font-family:Syne,sans-serif;font-size:14px;letter-spacing:-.03em}.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:var(--accent);color:#181126;font-weight:800}.period{font:500 11px "DM Mono",monospace;color:var(--muted);letter-spacing:.04em}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:34px;margin-top:28px}.rail{position:sticky;top:20px;align-self:start}.rail h1{font:700 28px/1 Syne,sans-serif;letter-spacing:-.07em;margin:12px 0 28px}.rail h1 span{display:block;color:var(--muted);font:500 13px/1.3 "DM Mono",monospace;letter-spacing:0;margin-top:12px}.event-tabs{display:grid;gap:5px}.event-tab{appearance:none;text-align:left;border:0;border-radius:11px;color:var(--muted);background:transparent;padding:12px 12px;font:600 13px "DM Sans",sans-serif;cursor:pointer;transition:.2s}.event-tab:hover{background:rgba(255,255,255,.05);color:var(--text)}.event-tab[aria-selected="true"]{color:var(--text);background:rgba(var(--accent-rgb),.14);box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.25)}.rail-note{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;font-size:12px;line-height:1.5;color:var(--muted)}main{min-width:0}.hero{min-height:270px;display:flex;align-items:flex-end;padding:26px 28px 30px;position:relative;overflow:hidden;background:linear-gradient(125deg,rgba(var(--accent-rgb),.21),rgba(255,255,255,.025) 55%,rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.12);border-radius:20px}.hero:aft o",monospace;color:var(--muted);letter-spacing:.04em}.finance td:last-child,.finance th:last-child{text-align:right;font-family:"DM Mono",monospace}.finance tr:last-child td{border-bottom:0}.finance .total td{font-weight:700;color:var(--text);background:rgba(var(--accent-rgb),.08)}.exceptions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.exception{padding:17px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.exception b{font:700 13px Syne,sans-serif;letter-spacing:-.03em}.exception p{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 0 0}.source{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font:400 10px/1.55 "DM Mono",monospace;color:#777685}.source b{color:#b8b5c4;font-weight:500}@media(max-width:980px){.layout{grid-template-columns:1fr}.rail{position:static}.rail h1{margin-bottom:16px}.event-tabs{grid-template-columns:repeat(3,1fr)}.rail-note{display:none}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.shell{padding:16px 14px 36px}.topbar{align-items:flex-start;flex-direction:column;gap:8px}.event-tabs{grid-template-columns:1fr}.hero{min-height:305px;padding:23px 20px}.hero h2{font-size:39px}.grid,.campaign-grid{grid-template-columns:1fr}.metrics,.exceptions{grid-template-columns:1fr}.section-heading{align-items:flex-start;flex-direction:column}.section-heading p{text-align:left}.campaign{grid-template-columns:1fr repeat(3,1fr);gap:8px}.campaign-name{grid-column:1/-1}.campaign-value{text-align:left}.quote{font-size:28px}}

<body><div class="shell"><header class="topbar"><div class="brand"><img src="../../assets/logo-desenrolai-branco.svg" alt="Desenrolaí"> <span>CRM PERFORMANCE</span></div><div class="period">PRÉVIA PARCIAL · SETEMBRO 2026</div></header><div class="layout"><aside class="rail"><h1>O mês<br>em sinal.<span>1 CRM(s) · leitura por evento</span></h1><nav class="event-tabs" aria-label="Selecionar CRM" id="eventTabs"></nav><p class="rail-note">Resultados de negócio, comunicação e pendências na mesma leitura.</p></aside><main id="app" tabindex="-1"></main></div></div>
<script type="application/json" id="reports-data">{"mpf-sp": {"name": "MPF São Paulo", "accent": "#75e1ae", "rgb": "117,225,174", "image": "mpf-hero.jpeg", "slug": "mpf-sp", "thesis": "3 ações medidas; vendas em conciliação.", "metrics": [["Enviados", "6.494", "E-mail · ROI Scale"], ["Entrega", "98,8%", "6.414 entregues"], ["Aberturas", "45,0%", "2.884 · sobre entregues"], ["Cliques", "96", "1,5% dos entregues"]], "split": [["Entregues", "6.414", 100], ["Aberturas", "2.884", 45.0], ["Cliques", "96", 1.5]], "insight": "6.414 entregues. A atribuição de vendas aguarda a planilha final.", "insightFoot": "ROI Scale API v3 · taxas sobre entregues, exceto entrega", "campaigns": [["[EMAIL] MPF | Virada de lote | Engajado | CRM10 | 03-09-26", "email · 2026-09-03 · 257 envios", "98,1%", "36,1%", "18,7%"], ["[EMAIL] MPF | Virada de lote | Carrinho | CRM10 | 03-09-26", "email · 2026-09-03 · 356 envios", "97,8%", "7,2%", "2,0%"], ["[EMAIL] MPF | Virada de lote | Engajado Correto | CRM10 | 03-09-26", "email · 2026-09-03 · 5.881 envios", "98,9%", "47,6%", "0,7%"]], "sales": [], "exceptions": [["Vendas por código", "Planilha final de compradores ainda não importada. Compras, ingressos e valor por código: n/d."], ["Corte e contexto", "Corte parcial da Ingresse: CRM10 teve 12 compradores, 14 ingressos e R$ 2.187,00 em valor final exportado até 21/09. O código consta em code_passkey; aguardar nova planilha para o fechamento."], ["Cobertura de canais", "Este corte não contém métricas confirmadas de WhatsApp ou bot para o evento."]], "sources": ["ROI Scale API v3 · 3 ações registradas", "Registro de 4 códigos CRM", "Notas operacionais com fonte; conferir corte no bloco de exceções"]}}</script><script>const reports=JSON.parse(document.getElementById('reports-data').textContent),keys=Object.keys(reports);let selected=keys[0];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function render(){const r=reports[selected],app=document.getElementById('app');document.documentElement.style.setProperty('--accent',r.accent);document.documentElement.style.setProperty('--accent-rgb',r.rgb);
document.getElementById('eventTabs').innerHTML=keys.map(key=>`<button type="button" class="event-tab" aria-selected="${key===selected}" onclick="selectReport('${key}')">${esc(reports[key].name)}</button>`).join('');
const metrics=r.metrics.length?`<section class="section"><div class="section-heading"><h3>Resultado executivo</h3><p>O que já está medido nesta competência.</p></div><div class="metrics">${r.metrics.map(m=>`<article class="metric"><span class="label">${esc(m[0])}</span><strong>${esc(m[1])}</strong><small>${esc(m[2])}</small></article>`).join('')}</div></section>`:'';
const funnel=r.split.length?`<section class="section grid"><article class="panel"><h4>Da entrega ao clique</h4><p class="report-note">Aberturas e cliques como proporção dos e-mails entregues.</p><div class="split-list">${r.split.map(x=>`<div class="split-row"><span>${esc(x[0])}</span><div class="track"><div class="fill" style="width:${Math.min(100,Math.max(0,Number(x[2])||0))}%"></div></div><b>${esc(x[1])}</b></div>`).join('')}</div></article><article class="panel insight"><div class="quote">“${esc(r.insight)}”</div><footer>${esc(r.insightFoot)}</footer></article></section>`:'';
const campaigns=r.campaigns.length?`<section class="section"><div class="section-heading"><h3>Campanhas e jornadas</h3><p>Última revisão de cada campanha; canais sem métricas confirmadas não entram na soma.</p></div><div class="campaign-grid is-single"><article class="panel"><div class="campaign-list">${r.campaigns.map(c=>`<div class="campaign"><div class="campaign-name">${esc(c[0])}<small>${esc(c[1])}</small></div><div class="campaign-value"><small>ENTREGA</small>${esc(c[2])}</div><div class="campaign-value"><small>ABERTURA</small>${esc(c[3])}</div><div class="campaign-value"><small>CLIQUE</small>${esc(c[4])}</div></div>`).join('')}</div></article></div></section>`:'';
const sales=r.sales.length?`<section class="section"><div class="section-heading"><h3>Vendas por código CRM</h3><p>Pedidos pagos únicos confirmados na planilha de compradores.</p></div><article class="panel finance"><table><thead><tr><th>Código</th><th>Uso registrado</th><th>Compras</th><th>Valor informado</th></tr></thead><tbody>${r.sales.map(x=>`<tr>${x.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></article></section>`:'';
const exceptions=r.exceptions.length?`<section class="section"><div class="section-heading"><h3>Exceções que ficam visíveis</h3><p>Pendências preservadas sem estimar o que não foi confirmado.</p></div><div class="exceptions">${r.exceptions.map(x=>`<article class="exception"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></article>`).join('')}</div></section>`:'';
app.innerHTML=`<section class="hero" style="--hero-image:url('../../assets/${esc(r.image)}')"><div class="hero-copy"><div class="eyeline">RELATÓRIO CRM · ${esc(r.name.toUpperCase())} · SETEMBRO 2026</div><h2>${esc(r.thesis)}</h2><p>Campanhas, vendas e pendências desta competência, com fonte e limite de leitura.</p></div></section>${metrics}${funnel}${campaigns}${sales}${exceptions}<footer class="source"><b>Fontes do corte:</b> ${esc(r.sources.join(' · '))}. Métricas ausentes aparecem como n/d. Prévia sujeita a atualização.</footer>`;}
function selectReport(id){if(!reports[id])return;selected=id;render();document.getElementById('app').focus()}render();</script></body></html>
